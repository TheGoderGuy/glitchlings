<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glitchlings – Kampf-Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE9FF; --panel:#FFFFFF; --panel2:#E4DBFF; --ink:#231B3F; --muted:#665C8C;
  --mint:#14A37C; --coral:#D9365C; --sun:#C98F00; --tileP:#CDF3E6; --tileE:#FFD9E1; --line:#CBBEF3;
  --shade:rgba(35,27,63,.55);
  --pixel:"Silkscreen","Courier New",monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1738; --panel:#2C2352; --panel2:#3A2F6B; --ink:#F6F1FF; --muted:#B2A8D8;
    --mint:#6EE7C5; --coral:#FF7A93; --sun:#FFC83D; --tileP:#244852; --tileE:#4C2847; --line:#4A3E80;
    --shade:rgba(10,6,24,.72);
  }
}
:root[data-theme="dark"]{
  --bg:#1E1738; --panel:#2C2352; --panel2:#3A2F6B; --ink:#F6F1FF; --muted:#B2A8D8;
  --mint:#6EE7C5; --coral:#FF7A93; --sun:#FFC83D; --tileP:#244852; --tileE:#4C2847; --line:#4A3E80;
  --shade:rgba(10,6,24,.72);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}

.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.who{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.who small{font-weight:700;color:var(--muted);font-size:12px}
.enemy .who{flex-direction:row-reverse}
.bar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;transition:width .15s linear}
.player .bar i{background:var(--mint)}
.enemy .bar i{background:var(--coral);margin-left:auto}
.room{font-family:var(--pixel);font-size:13px;color:var(--muted);text-align:center;padding-bottom:2px;white-space:nowrap}

.arena{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:18px;background:var(--panel);overflow:hidden;cursor:pointer;box-shadow:0 0 0 3px var(--panel2)}
.arena canvas{display:block;width:100%}
.status{min-height:22px;font-size:13px;color:var(--muted);text-align:center;font-weight:700}

.card .sig,.card span.sig{display:block;font-size:12px;line-height:1.35;color:var(--ink);margin:3px 0 5px}.card .sig b{display:inline;font-size:12px;font-weight:800;margin:0;color:var(--ink)}
.hearts,.card span.hearts{display:block;color:#FF6FA8;font-size:15px;letter-spacing:1px;margin-top:3px}
.hearts.big{font-size:26px;text-align:center;margin:2px 0 6px}
.card{position:relative}.card.away{opacity:.62}
.carebtn,.card span.carebtn{display:inline-block;margin:0;line-height:1.2;position:absolute;right:10px;top:10px;font-size:12px;font-weight:800;color:#C2327A;background:var(--panel2);border-radius:999px;padding:4px 10px;cursor:pointer;box-shadow:inset 0 0 0 2px #FF9EC7}
.card span.carebtn:hover,.card span.carebtn:focus-visible{background:#FFE3EF;outline:none}
.care{text-align:center}.care h2{margin:4px 0 0}
.carestage{position:relative;display:inline-block;cursor:pointer;border-radius:24px;background:var(--panel2);padding:14px 26px;margin:10px auto 4px;touch-action:manipulation}
.carestage canvas{display:block;image-rendering:pixelated;width:160px;height:160px}
.care .bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:4px 0}.care .bar i{display:block;height:100%;background:#FF6FA8;border-radius:99px}
.carestage.hop{animation:hop .45s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px) scale(1.03)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.petfx{position:absolute;inset:0;pointer-events:none}
.petfx span{position:absolute;bottom:40%;color:#FF6FA8;font-size:22px;font-weight:900;animation:heartup 1.1s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes heartup{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.perks{list-style:none;padding:0;margin:6px 0 10px;text-align:left}.perks li{padding:6px 10px;border-radius:10px;color:var(--muted);font-size:14px}.perks li.on{color:var(--ink);background:#FFE3EF;font-weight:700}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.zone{border:0;border-radius:12px;background:var(--panel);padding:10px;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line),inset 6px 0 0 var(--el);color:inherit;font:inherit}
.zone b{display:block;padding-left:4px}.zone span{display:block;font-size:12px;color:var(--muted);padding-left:4px;margin-top:2px}
.zone.on,.minib.sel,.btn.sel{box-shadow:inset 0 0 0 3px var(--sun),inset 6px 0 0 var(--el,var(--sun))}
.plan{background:var(--panel);border-radius:16px;padding:12px;margin-top:12px;box-shadow:inset 0 0 0 2px var(--line)}
.bondline{font-size:14px;margin:6px 0}.bondline b{color:#C2327A}
@media (prefers-reduced-motion:reduce){.carestage.hop,.petfx span{animation:none}}
.special{position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);padding:9px 12px;text-align:left;cursor:pointer;touch-action:manipulation;margin:2px 0 8px;color:inherit;font:inherit}
.special .sf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--el,#999);opacity:.28;transition:width .15s}
.special .st{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px}
.special .sn{font-size:14px}.special .sk{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.special .sd{position:relative;display:block;font-size:12px;color:var(--muted);margin-top:2px}
.special.ready{box-shadow:inset 0 0 0 3px var(--el,#999);animation:spglow 1s ease-in-out infinite}
.special.ready .sf{opacity:.45}.special.ready .sk{color:var(--ink)}
@keyframes spglow{50%{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){.special.ready{animation:none}}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{position:relative;overflow:hidden;border:0;border-radius:14px;background:var(--panel);padding:10px 8px 10px 14px;text-align:left;min-height:84px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);touch-action:manipulation}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--el,#999)}
.chip .n{font-weight:800;font-size:14px;line-height:1.15;display:block}
.chip .m{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.chip .k{position:absolute;right:8px;top:6px;font-family:var(--pixel);font-size:11px;color:var(--muted)}
.chip .cd{position:absolute;left:0;right:0;bottom:0;background:var(--shade);pointer-events:none}
.chip.off{cursor:pointer}
.chip.queued{box-shadow:inset 0 0 0 3px var(--sun)}
.chip.queued .k::after{content:" vorgemerkt";color:var(--sun)}
.chip.off .n{opacity:.55}
.chip.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.enemy .nm{flex-direction:row-reverse}
.pt{width:30px;height:30px;image-rendering:pixelated;background:var(--panel2);border-radius:8px;flex:none}
.chip .ico{display:block;width:18px;height:14px;image-rendering:pixelated;margin-bottom:4px}
.bar{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.player .bar i,.enemy .bar i{background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.14) 10px 12px)}
.deckbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:-2px}
.deckbar .next{display:flex;align-items:center;gap:6px;min-width:0}
.deckbar .next b{color:var(--ink)}
.deckbar img{width:14px;height:11px;image-rendering:pixelated}
.deckbtn{border:0;border-radius:99px;background:var(--panel2);padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.dlist{display:grid;gap:6px;margin:8px 0 16px}
.dl{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 12px;border-left:6px solid var(--el)}
.dl img{width:16px;height:12px;image-rendering:pixelated}
.dl b{font-size:14px}.dl span{display:block;font-size:12px;color:var(--muted)}
.dl em{font-style:normal;font-family:var(--pixel);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--panel);box-shadow:inset 3px 0 0 var(--el)}
.pill img{width:12px;height:9px;image-rendering:pixelated}
.tag.good{background:var(--mint);color:#10231D}.tag.bad{background:var(--coral);color:#fff}
.deckbox{background:var(--panel2);border-radius:16px;padding:12px 14px;margin:0 0 16px}
.deckbox .t{font-weight:800;font-size:14px}
.deckbox .s{font-size:12px;color:var(--muted);margin-top:4px}
h3{font-size:15px;margin:14px 0 4px}
.hint{margin:0;font-size:12px;color:var(--muted);text-align:center}

.overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:5;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.overlay[hidden]{display:none}
.sheet{max-width:560px;margin:0 auto}
.logo{font-family:var(--pixel);font-weight:700;font-size:clamp(40px,12vw,64px);line-height:1;margin:18px 0 6px;letter-spacing:.02em;position:relative;display:inline-block}
.logo.glitch{animation:glitch .9s steps(2) 1}
@keyframes glitch{
  0%{text-shadow:4px 0 var(--coral),-4px 0 var(--mint);transform:translateX(3px)}
  30%{text-shadow:-5px 0 var(--coral),5px 0 var(--mint);transform:translateX(-4px) skewX(-8deg)}
  60%{text-shadow:2px 0 var(--coral),-2px 0 var(--mint);transform:translateX(1px)}
  100%{text-shadow:none;transform:none}
}
.lede{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 20px;max-width:34em}
h2{font-family:var(--pixel);font-weight:400;font-size:22px;margin:8px 0 12px}
.picks{display:grid;gap:12px}
.card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;width:100%;border:0;text-align:left;background:var(--panel);border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.card:hover{box-shadow:inset 0 0 0 2px var(--mint)}
.card canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--panel2);border-radius:14px}
.card b{font-size:18px;display:flex;align-items:center;gap:8px}
.card b img{width:18px;height:14px;image-rendering:pixelated}
.card span{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--panel2);margin-right:4px;margin-top:6px}
.chipcard{grid-template-columns:1fr;position:relative;padding-left:22px}
.chipcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:18px 0 0 18px;background:var(--el)}
.big{font-family:var(--pixel);font-size:28px;margin:10px 0 4px}
.near{font-size:17px;font-weight:800;color:var(--coral);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--panel);border-radius:14px;padding:10px 12px}
.stat b{font-family:var(--pixel);font-size:20px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.praeg{background:var(--panel);border-radius:18px;padding:14px;margin:12px 0}
.praeg .row{display:grid;grid-template-columns:64px 1fr 36px;gap:8px;align-items:center;font-size:13px;font-weight:700;margin:6px 0}
.praeg .row .bar{margin:0}
.praeg .row .bar i{background:var(--el)}
.evo{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:14px}
.evo canvas{width:84px;height:84px;image-rendering:pixelated;background:var(--panel2);border-radius:14px}
.evo p{margin:0;line-height:1.45}
.evo .t{font-weight:800;font-size:17px;margin-bottom:4px}
.evo .bar i{background:var(--sun)}
.btns{display:grid;gap:10px;margin-top:18px}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;cursor:pointer;background:var(--mint);color:#10231D}
.btn.alt{background:var(--panel2);color:var(--ink)}
.help{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px}
.help b{color:var(--ink)}
.sthead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;margin-top:6px;flex-wrap:wrap}
.logo.small{font-size:clamp(30px,9vw,44px);margin:6px 0 0}
.wallet{font-family:var(--pixel);font-size:14px;background:var(--panel);padding:8px 12px;border-radius:12px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:16px 0 14px;overflow-x:auto;padding-bottom:4px}
.tab{border:0;border-radius:12px;background:var(--panel);padding:9px 12px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 2px var(--line)}
.tab.on{background:var(--ink);color:var(--bg);box-shadow:none}
.nest{display:grid;gap:12px;margin-bottom:12px}
.nslot{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:14px}
.nslot.empty{grid-template-columns:1fr;border:2px dashed var(--line);background:transparent}
.nslot.empty p{margin:0}
.nslot b{font-size:16px}
.nslot .help{margin:4px 0 6px}
.nslot .small{font-size:12px;margin:8px 0 0}
.nslot.ready{box-shadow:inset 0 0 0 3px var(--sun)}
.row2{margin-top:10px}
.row2 .btn{padding:10px 14px;font-size:14px}
.nslot canvas{width:64px;height:64px;image-rendering:pixelated}
.wob{animation:wob .9s ease-in-out infinite}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.eggs{display:flex;flex-wrap:wrap;gap:10px}
.eggbtn{display:grid;justify-items:center;gap:4px;border:0;background:var(--panel);border-radius:14px;padding:10px;cursor:pointer;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 2px var(--line)}
.eggbtn canvas{width:48px;height:48px;image-rendering:pixelated}
.btn.wide{width:100%;margin:4px 0 8px}
.reveal{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:inset 0 0 0 3px var(--mint);animation:rise .5s ease-out}
.reveal canvas{width:96px;height:96px;image-rendering:pixelated}
.reveal .t{font-weight:800;font-size:18px;margin:0 0 6px}
.reveal p{margin:0 0 10px;line-height:1.45}
@keyframes rise{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.dx{background:var(--panel);border-radius:14px;padding:8px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:800;text-align:center}
.dx canvas{width:56px;height:56px;image-rendering:pixelated}
.dx.unk{color:var(--muted)}.dx.unk canvas{opacity:.28}
.fusebox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:4px 0 12px}
.fslot{background:var(--panel);border-radius:16px;min-height:112px;display:grid;justify-items:center;align-content:center;gap:4px;padding:10px;font-weight:800;font-size:13px;border:2px dashed var(--line);text-align:center;color:var(--muted)}
.fslot.full{border-style:solid;border-color:var(--mint);color:var(--ink)}
.fslot canvas{width:64px;height:64px;image-rendering:pixelated}
.plus{font-family:var(--pixel);font-size:24px}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.minib{display:grid;justify-items:center;gap:2px;border:0;background:var(--panel);border-radius:12px;padding:6px 8px;cursor:pointer;font-size:11px;font-weight:800;box-shadow:inset 0 0 0 2px var(--line);min-width:74px}
.minib.sel{box-shadow:inset 0 0 0 3px var(--mint)}
.minib canvas{width:40px;height:40px;image-rendering:pixelated}
.msg{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin:0 0 12px}
.recipes{display:grid;gap:6px;margin-bottom:10px}
.rc{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.rc.unk{color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--coral);font-weight:800;cursor:pointer;text-decoration:underline}
details.help summary{cursor:pointer;margin-bottom:6px}
.btn:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;z-index:20;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.admodal{position:fixed;inset:0;background:rgba(10,6,24,.92);color:#fff;display:grid;place-items:center;z-index:30;text-align:center;font-weight:800;padding:24px}
.admodal b{font-family:var(--pixel);font-size:48px;display:block;margin-top:12px}
@media (prefers-reduced-motion:reduce){.wob,.breathe,.reveal{animation:none}.logo.glitch,.chip.pop{animation:none}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="hud">
    <div class="player"><div class="who"><span class="nm"><canvas class="pt" id="pPt" width="36" height="36"></canvas><span id="pName">Pixmiez</span></span><small id="pHp">100</small></div><div class="bar"><i id="pBar"></i></div></div>
    <div class="room" id="room">1/4</div>
    <div class="enemy"><div class="who"><span class="nm"><canvas class="pt" id="ePt" width="36" height="36"></canvas><span id="eName">Bugsy</span></span><small id="eHp">70</small></div><div class="bar"><i id="eBar"></i></div></div>
  </header>
  <div class="arena" id="arena" aria-label="Kampffeld. Wischen zum Bewegen."><canvas id="cv"></canvas></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="deckbar"><span class="next" id="nextChip"></span><button type="button" class="deckbtn" id="deckBtn">Deck ansehen</button></div>
  <button type="button" class="special" id="special" hidden><span class="sf"></span><span class="st"><b class="sn">Signatur</b><span class="sk">0 %</span></span><span class="sd"></span></button>
  <div class="hand" id="hand"></div>
  <p class="hint">Feld antippen oder wischen zum Bewegen. Am Rechner mit zwei Händen: WASD bewegen, J K L für Chips. Ladende Chips antippen, um sie vorzumerken.</p>
</main>
<section class="overlay" id="overlay"><div class="sheet" id="sheet"></div></section>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const EL={Neutral:'#B8B0DD',Feuer:'#FF8A4C',Code:'#58D68D',Wasser:'#4CC3F0',Licht:'#FFD84D',Virus:'#C77DFF'};
const CHIPS={
 'Pixelstrahl':{cat:'Angriff',el:'Neutral',dmg:20,cd:2.0,rar:'Gewöhnlich',desc:'Projektil über deine Reihe.'},

function shadeHex(hex,amt){hex=(hex||'#888888').trim();if(hex[0]!=='#'||hex.length<7)return hex;const n=parseInt(hex.slice(1,7),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}

function lumOf(h){const n=parseInt(h.slice(1,7),16);return ((n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11)/255}

  const rows=(o.blink&&s.pb)?s.pb:s.px;

    if(o.solid)col=o.solid;else if(o.flash&&!edge)col='#FFFFFF';
    else if(o.tint&&!edge){const l=lumOf(col);col=l>.55?mixHex(o.tint,'#FFFFFF',(l-.55)*1.3):mixHex(shadeHex(o.tint,-.55),o.tint,l/.55)}

/* ---------- Damage ---------- */
function hitEnemy(d,el,dot){
  const F=G.F,e=F.e;if(F.over)return;const m=dot?1:mult(el,e.def.el);d=Math.round(d*m);
  if(!dot&&F.scan>0){F.scan--;d=Math.round(d*1.5)}
  e.hp=Math.max(0,e.hp-d);e.flash=.09;if(!dot&&!F.inSpecial)F.sp=Math.min(100,F.sp+d*1.2);
  floatAt(3+e.c,e.r,(m>1?'Effektiv! ':'')+d,m>1?TH['--sun']:(dot?EL[el]:TH['--ink']));
  if(!dot){F.parts.push({ring:true,x:3+e.c+.5,y:e.r+.45,color:m>1?TH['--sun']:'#FFFFFF',t:.3,max:.3});F.shake=Math.max(F.shake,d>=30?7:4);if(d>=30)G.freeze=.06;burst(3+e.c+.5,e.r+.5,EL[el]||'#fff',8)}
  if(e.hp<=0)winFight();
}
function hurtPlayer(d,src){
  const F=G.F,R=G.run;if(F.over)return;
  if(R.M.dodge&&Math.random()<R.M.dodge){floatAt(F.p.c,F.p.r,'Spuk!',EL.Virus);return}
  if(F.decoy>0&&F.decoyT>0){F.decoy--;floatAt(F.p.c,F.p.r,'Abbild fängt ab!',EL.Code);burst(F.p.c+.3,F.p.r+.5,EL.Code,10);return}
  if(F.reflex>0){F.reflex--;floatAt(F.p.c,F.p.r,'Katzenreflex!',TH['--mint']);burst(F.p.c+.5,F.p.r+.5,'#C9B8FF',14);return}
  if(R.sp==='Quakli'){F.e.poison=Math.max(F.e.poison,3);floatAt(3+F.e.c,F.e.r,'Giftbaut',EL.Virus)}
  if(F.shield>0){F.shield=0;floatAt(F.p.c,F.p.r,'Geblockt',EL.Code);return}
  if(F.bubble>0&&F.bubbleT>0){const a=Math.min(F.bubble,d);F.bubble-=a;d-=a;if(F.bubble<=0)floatAt(F.p.c,F.p.r,'Blase platzt',EL.Wasser);if(d<=0)return}
  if(R.sp==='Brummbit')d=Math.max(1,Math.round(d*.75));
  if(R.hp-d<=0&&R.friend&&!R.friendUsed){R.friendUsed=true;d=R.hp-1;floatAt(F.p.c,F.p.r,'Hält durch – für dich!',TH['--mint']);burst(F.p.c+.5,F.p.r+.5,'#FF9EC7',18)}
  R.hp=Math.max(0,R.hp-d);F.sinceHit=0;F.sp=Math.min(100,F.sp+d*1.5);F.p.flash=.12;F.hurt=.3;F.parts.push({ring:true,x:F.p.c+.5,y:F.p.r+.45,color:TH['--coral'],t:.3,max:.3});F.shake=Math.max(F.shake,8);
  floatAt(F.p.c,F.p.r,'-'+d,TH['--coral']);
  if(R.hp<=0)loseRun();
}

/* ---------- FX ---------- */
function floatAt(c,r,text,color){G.F.fx.push({x:c+.5,y:r+.35,text,color,t:.9,max:.9})}
function fxCell(c,r,color,t){G.F.parts.push({cell:true,c,r,color,t,max:t})}
function burst(x,y,color,n){if(reduceMotion)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1.2+Math.random()*2.5;G.F.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,t:.45,max:.45})}}

/* ---------- Update ---------- */
function update(dt){
  const F=G.F,R=G.run,p=F.p,e=F.e,def=e.def;if(!F||F.over)return;
  F.t+=dt;if(F.hurt>0)F.hurt-=dt;p.cd=Math.max(0,p.cd-dt);p.flash=Math.max(0,p.flash-dt);e.flash=Math.max(0,e.flash-dt);F.shake=Math.max(0,F.shake-dt*30);
  if(F.shield>0)F.shield-=dt;if(F.bubbleT>0){F.bubbleT-=dt;if(F.bubbleT<=0)F.bubble=0}
  if(F.oc>0)F.oc-=dt;
  if(F.decoyT>0){F.decoyT-=dt;if(F.decoyT<=0)F.decoy=0}
  F.sinceHit+=dt;if(R.sp==='Tröpfel'&&F.sinceHit>=3&&R.hp<R.maxHp){F.regT-=dt;if(F.regT<=0){F.regT=1;const h=Math.min(stageOf(progFor(R.mon))>=3?2:1,R.maxHp-R.hp);R.hp+=h;floatAt(p.c,p.r,'+'+h,TH['--mint'])}}
  const rate=R.M.rech*(F.oc>0?2:1);
  F.hand.forEach(s=>{if(s.rem>0){s.rem=Math.max(0,s.rem-dt*rate)}});
  for(let i=0;i<3;i++){const s=F.hand[i];if(s.queued&&s.chip&&s.rem<=0){useSlot(i);if(F.over)return}}
  if(F.pend&&p.cd<=0){const [c,r]=F.pend;F.pend=null;moveTo(c,r)}

  for(let i=F.delayed.length-1;i>=0;i--){const d=F.delayed[i];d.t-=dt;if(d.t<=0){F.delayed.splice(i,1);d.fn();if(F.over)return}}
  for(let i=F.marks.length-1;i>=0;i--){F.marks[i].t-=dt;if(F.marks[i].t<=0)F.marks.splice(i,1)}

  for(let i=F.proj.length-1;i>=0;i--){const pr=F.proj[i];
    if(pr.lob){pr.t+=dt;if(pr.t>=pr.dur){F.proj.splice(i,1);pr.land();if(F.over)return}continue}
    pr.x+=pr.v*dt;
    if(e.r===pr.row&&Math.abs(pr.x-(3+e.c+.5))<.4){F.proj.splice(i,1);
      hitEnemy(pr.dmg,pr.el);if(F.over)return;
      if(pr.id==='Wasserstrahl'&&e.c<2){e.c++}
      if(pr.id==='Virusspritzer')e.poison=4;
      continue}
    if(pr.x>6.3)F.proj.splice(i,1)}

  // DOTs
  if(e.burn>0||e.poison>0){e.dotT-=dt;if(e.dotT<=0){e.dotT=1;
    const dm=R.sp==='Molchi'?1.5:1;
    if(e.burn>0){e.burn--;hitEnemy(Math.round(5*dm),'Feuer',true);if(F.over)return}
    if(e.poison>0){e.poison--;hitEnemy(Math.round(4*dm),'Virus',true);if(F.over)return}}}
  for(let i=F.bots.length-1;i>=0;i--){const b=F.bots[i];b.t-=dt;b.tick-=dt;if(b.tick<=0){b.tick=1;hitEnemy(5,'Code',true);if(F.over)return}if(b.t<=0)F.bots.splice(i,1)}
  for(let i=F.mines.length-1;i>=0;i--){const m=F.mines[i];m.t-=dt;m.arm-=dt;
    if(m.arm<=0&&e.c===m.c&&e.r===m.r){F.mines.splice(i,1);burst(3+m.c+.5,m.r+.5,EL.Virus,16);hitEnemy(35,'Virus');if(F.over)return;continue}
    if(m.t<=0)F.mines.splice(i,1)}

  // Enemy AI
  const phase=def.boss?(e.hp/e.max>.5?1:e.hp/e.max>.2?2:3):1;
  if(e.frozen>0){e.frozen-=dt}else{

function tryFuse(){const [a,b]=G.fuse;if(!a||!b)return;const A=instSp(a),B=instSp(b);
  const i=RECIPES.findIndex(r=>(r.a===A&&r.b===B)||(r.a===B&&r.b===A));
  if(i<0){const hidden=RECIPES.map((r,k)=>k).filter(k=>!G.recipes.includes(RECIPES[k].r)&&!G.hints.includes(k));
    if(hidden.length)G.hints.push(hidden[rnd(hidden.length)]);
    G.fuseMsg='Die Daten stoßen sich ab. Nichts passiert, und es kostet dich nichts.'+(hidden.length?' Dafür hast du ein neues Gerücht im Rezeptbuch.':'');save();showStation('lab');return}
  const R=RECIPES[i];
  if(R.night&&new Date().getHours()>=4){if(!G.hints.includes(i))G.hints.push(i);G.fuseMsg='Die Daten flackern kurz … aber etwas fehlt noch. Vielleicht klappt es, wenn alle schlafen.';save();showStation('lab');return}
  if(G.frag<FUSION_COST){G.fuseMsg=`Das passt zusammen! Dir fehlen aber noch ${FUSION_COST-G.frag} Fragmente.`;showStation('lab');return}
  G.frag-=FUSION_COST;G.col=G.col.filter(c=>c.id!==a&&c.id!==b);delete G.prog[a];delete G.prog[b];
  const id='m'+(G.nextId++);G.col.push({id,sp:R.r});const isNew=addDex(R.r);if(!G.recipes.includes(R.r))G.recipes.push(R.r);
  G.fuse=[null,null];G.fuseMsg='';G.fuseReveal={sp:R.r,isNew};save();showStation('lab')}

function unlockAll(){const col=[],prog={};let n=1;
  const add=(sp,evolved,el,stage,pts,extra)=>{const id='m'+(n++);col.push({id,sp});prog[id]=Object.assign({praeg:el?{[el]:50}:{},eis:0,pts:pts||0,runs:0,evolved:evolved||null,evolvedEl:el||null,stage:stage||1},extra||{})};
  Object.entries(MONS).forEach(([sp,M])=>{
    if(M.fusion){add(sp);return}
    add(sp);
    Object.entries(M.evo||{}).forEach(([el,name])=>{add(sp,name,el,2,100);let cur=name,st=2;
      while(UP[cur]){const [nx,pts]=UP[cur];st++;add(sp,nx,el,st,pts);cur=nx}});
    if(M.secret)add(sp,M.secret,'Licht',2,100);
    if(sp==='Tröpfel')add(sp,'Frostbyte','Wasser',2,100,{eis:8})});
  G.col=col;G.prog=prog;G.nextId=n;DEX.forEach(([name])=>{G.dex[name]=1})}
function tryEvolve(id){const P=progFor(id),sp=instSp(id),M=MONS[sp];if(M.fusion)return null;
  if(!P.evolved){if(P.pts>=100){const ev=evoInfo(id);if(ev){P.evolved=ev.name;P.evolvedEl=ev.el;P.stage=2;return{name:ev.name,el:ev.el,stage:'Rookie',isNew:addDex(ev.name)}}}return null}
  const nx=UP[P.evolved];if(nx&&P.pts>=nx[1]){P.evolved=nx[0];P.stage=stageOf(P)+1;return{name:nx[0],el:P.evolvedEl,stage:nx[2],isNew:addDex(nx[0])}}return null}
function evoInfo(mon){const sp=instSp(mon),M=MONS[sp],P=progFor(mon);const pr=P.praeg;if(M.fusion)return null;
  if(sp==='Tröpfel'&&P.eis>=8)return{name:'Frostbyte',el:'Wasser'};
  const nonN=Object.entries(pr).filter(([k])=>k!=='Neutral');const tot=nonN.reduce((a,[,v])=>a+v,0);
  if(M.secret&&tot>=20&&nonN.length>=4&&nonN.every(([,v])=>v/tot<=.3))return{name:M.secret,el:'Licht'};
  let best=null;Object.keys(M.evo).forEach(k=>{if((pr[k]||0)>0&&(!best||pr[k]>pr[best]))best=k});
  return best?{name:M.evo[best],el:best}:null}

  const slot=sheet.querySelector('.evo .slot');
  if(slot&&slot.dataset.next){slot.replaceWith(spriteCanvas(slot.dataset.next,84,{solid:TH['--ink']}))}
  else if(slot){const ms=monSpr(R.mon);const key=(P.evolved||R.M.fusion)?ms.key:(ev&&SPR[ev.name]?ev.name:R.M.spr);slot.replaceWith(spriteCanvas(key,84,(P.evolved||R.M.fusion)?{tint:ms.tint}:{solid:TH['--ink']}))}
  $('#again').addEventListener('click',()=>startRun(R.mon));$('#other').addEventListener('click',()=>showStation(egg?'nest':'team'));
  $('#again').focus({preventScroll:true});
}

/* ---------- Loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.screen==='fight'){if(G.freeze>0)G.freeze-=dt;else update(dt)}
  render();requestAnimationFrame(frame)}
freshState();load();layout();showStation('team');requestAnimationFrame(frame);
window.__G={G,showStation,hatch,tryFuse,save,load,freshState,startRun,useSlot,movePlayer,update,showPick,showResult,readTheme,drawSprite};
})();
</script>
</body>
</html>
